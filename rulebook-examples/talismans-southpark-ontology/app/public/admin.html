<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rulebook admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/rulebook-explainer-dag/dag.css">
</head>
<body data-mode="tools" class="admin">
<div class="wrap wide">
  <!-- Both editors are Effortless's own pages. Each form of the rulebook has its colour; the page wears the one it edits. -->
  <nav class="modebar">
    <a href="/" data-kind="back" data-text="admin-back"></a>
    <span class="modebar-end"><span class="version" id="version"></span></span>
  </nav>
  <nav class="formswitch" aria-label="Which form of the rulebook this page edits">
    <span class="formswitch-label" data-text="form-switch-label"></span>
    <a class="formtab onto" href="/admin.html" aria-current="page"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 9 23 8M9 9l7 15M23 8l-7 16" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="9" r="4.2" fill="currentColor"/><circle cx="23" cy="8" r="4.2" fill="currentColor"/><circle cx="16" cy="24" r="4.2" fill="currentColor"/></svg><b data-text="form-switch-ontology"></b><small data-text="form-ontology-what"></small></a>
    <a class="formtab concept" href="/concepts.html" data-kind="page"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="24" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 12.5h24M4 19.2h24M12.5 6v20M20.5 6v20" fill="none" stroke="currentColor" stroke-width="2"/></svg><b data-text="form-switch-concepts"></b><small data-text="form-concepts-what"></small></a>
  </nav>
  <header>
    <h1 data-text="form-switch-ontology"></h1>
    <p data-text="admin-intro"></p>
  </header>

  <section class="card enginebar" aria-label="Engine">
    <div class="engine-row">
      <span class="engine-label" data-text="engine-label"></span>
      <span id="engines" class="engine-choices switch"></span>
      <button type="button" id="compare" data-text="conformance-button"></button>
    </div>
    <p id="engine-description" class="hint"></p>
    <div id="conformance" role="status" aria-live="polite"></div>
  </section>

  <section class="card actions" id="excel" aria-label="Rulebook">
    <!-- Buttons do something to the rows; underlined links go somewhere. Each group is one tool. -->
    <div class="action-groups">
      <div class="action-group">
        <span class="group-label" data-text="group-rows"></span>
        <span id="unsaved" class="unsaved"></span>
        <button type="button" class="primary" id="save" data-text="admin-save"></button>
        <button type="button" class="danger" id="discard" data-text="admin-discard"></button>
      </div>
      <div class="action-group">
        <span class="group-label" data-text="group-excel"></span>
        <button type="button" id="export" data-kind="download" data-text="admin-export"></button>
        <label class="buttonish" id="import-label" data-kind="upload"><span id="import-text" data-text="admin-import"></span><input type="file" id="import" accept=".xlsx" hidden></label>
      </div>
      <div class="action-group">
        <span class="group-label" data-text="group-file"></span>
        <a class="link" id="file" href="/rulebook/talismans-southpark-ontology-rulebook.json" target="_blank" rel="noopener" data-kind="newtab" data-text="admin-open-file"></a>
        <button type="button" id="rebuild" data-text="admin-rebuild"></button>
      </div>
      <div class="action-group">
        <span class="group-label" data-text="group-editor"></span>
        <a class="link" id="editor" target="_blank" rel="noopener" data-kind="newtab" data-text="admin-editor"></a>
        <p id="editor-note" class="hint"></p>
      </div>
    </div>
    <p class="kinds-key" aria-hidden="true"><span data-kind-key="page" data-text="kind-page"></span><span data-kind-key="newtab" data-text="kind-newtab"></span><span data-kind-key="download" data-text="kind-download"></span><span data-kind-key="upload" data-text="kind-upload"></span></p>
    <div id="message" class="form-message" role="status" aria-live="polite"></div>
    <details id="changes"><summary data-text="admin-changes-heading"></summary><ul id="change-list"></ul></details>
    <pre id="buildlog" hidden></pre>
  </section>

  <div class="admin-grid">
    <nav class="card table-list" id="tables" aria-label="Tables"></nav>
    <section class="card table-card">
      <h2 id="table-name"></h2>
      <p class="hint" id="table-description"></p>
      <div class="table-tools">
        <input type="text" id="filter" autocomplete="off">
        <label class="inline"><input type="checkbox" id="show-computed"> <span data-text="admin-show-computed"></span></label>
        <button type="button" id="add-row" data-text="admin-add-row"></button>
        <span id="row-count" class="hint"></span>
      </div>
      <div class="scroll"><table id="grid"></table></div>
    </section>
  </div>
</div>
<script src="/rulebook-explainer-dag/embedded-graph.js"></script>
<script src="/rulebook-explainer-dag/dag-resolver.js"></script>
<script src="/rulebook-explainer-dag/routing.js"></script>
<script src="/rulebook-explainer-dag/explainer-dag.js"></script>
<script src="/admin-shared.js"></script>
<script src="/admin.js"></script>
</body>
</html>
