<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rulebook editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<!-- Where a rulebook editor's link goes while its container is not running: this page asks the
     app to start it, says how that is going, and goes to the editor when it answers. -->
<body data-mode="tools" class="admin">
<div class="wrap">
  <nav class="modebar">
    <a id="back" data-kind="back"></a>
  </nav>
  <section class="card effortless editor-start">
    <span class="effortless-tag" data-text="effortless-tag"></span>
    <h1 id="heading"></h1>
    <p id="status" role="status" aria-live="polite"></p>
    <pre id="tail" class="editor-tail" hidden></pre>
    <p><button type="button" class="primary" id="retry" data-text="editor-retry" hidden></button></p>
  </section>
</div>
<script src="/admin-shared.js"></script>
<script src="/editor.js"></script>
</body>
</html>
