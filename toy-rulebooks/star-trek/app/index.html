<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Trek Explorer</title>
  <link rel="stylesheet" href="/rulebook-explainer-dag/dag.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e0e0;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px 16px 80px; }
    header { padding: 20px 0; border-bottom: 2px solid #00d4ff; margin-bottom: 24px; }
    h1 { font-size: 2.2em; color: #00d4ff; text-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }
    h1 a { color: inherit; text-decoration: none; }
    .tagline { color: #888; margin-top: 6px; font-size: 0.95em; }
    .breadcrumb { color: #888; margin-top: 12px; font-size: 0.9em; }
    .breadcrumb a { color: #00d4ff; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb .sep { margin: 0 6px; }

    .content { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 768px) { .content { grid-template-columns: 1fr; } h1 { font-size: 1.7em; } }

    .panel {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #00d4ff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .panel h2 { color: #00d4ff; margin-bottom: 14px; font-size: 1.3em; }
    .panel h3 { color: #00d4ff; margin: 18px 0 10px; font-size: 1.05em; }

    .item {
      display: block;
      padding: 12px;
      margin-bottom: 8px;
      background: rgba(0, 212, 255, 0.05);
      border-left: 3px solid #00d4ff;
      border-radius: 4px;
      color: inherit;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }
    .item:hover { background: rgba(0, 212, 255, 0.18); transform: translateX(4px); }
    .item-row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .item-name { font-weight: bold; color: #00d4ff; }
    .item-subtitle { font-size: 0.9em; color: #aaa; margin-top: 4px; }

    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 14px 0; }
    .stat { background: rgba(0, 212, 255, 0.07); border-radius: 6px; padding: 10px 12px; }
    .stat .label { font-size: 0.8em; color: #00d4ff; text-transform: uppercase; letter-spacing: 0.04em; }
    .stat .value { font-size: 1.25em; margin-top: 4px; color: #fff; }

    .badge { display: inline-block; font-size: 0.75em; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
    .badge.good { background: rgba(80, 220, 120, 0.2); color: #6fe39a; }
    .badge.long { background: rgba(255, 180, 60, 0.2); color: #ffc46b; }

    .details .field { margin-bottom: 14px; }
    .details .label { color: #00d4ff; font-weight: bold; font-size: 0.9em; }
    .details .value { color: #ccc; margin-top: 4px; line-height: 1.5; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .card {
      display: block;
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .card:hover { border-color: #00d4ff; background: rgba(0, 212, 255, 0.15); }
    .card .num { color: #00d4ff; font-weight: bold; font-size: 0.9em; }
    .card .title { margin-top: 6px; font-size: 0.9em; }
    .card .meta { color: #888; font-size: 0.8em; margin-top: 4px; }

    table.ratings { width: 100%; border-collapse: collapse; font-size: 0.9em; }
    table.ratings td { padding: 6px 4px; border-bottom: 1px solid #2a2f4a; }
    .stars { color: #ffd166; letter-spacing: 1px; }
    .muted { color: #777; }
    .error { color: #ff6b6b; padding: 15px; background: rgba(255, 107, 107, 0.1); border-radius: 4px; border-left: 3px solid #ff6b6b; }
    .loading { color: #888; padding: 30px 0; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><a href="/" data-link>🚀 Star Trek Explorer</a></h1>
      <div class="tagline">Every count, average and verdict on these screens is a rule in the rulebook, read from its Postgres views.
        Hover a value marked ƒ to see the rule.</div>
      <nav class="breadcrumb" id="breadcrumb"></nav>
    </header>
    <main id="page"><div class="loading">Loading…</div></main>
  </div>

  <script src="/rulebook-explainer-dag/embedded-graph.js"></script>
  <script src="/rulebook-explainer-dag/dag-resolver.js"></script>
  <script src="/rulebook-explainer-dag/routing.js"></script>
  <script src="/rulebook-explainer-dag/explainer-dag.js"></script>
  <script>
    EffortlessExplainer.init({ mode: 'modal', corner: 'bottom-right' });
  </script>
  <script src="/routes.js"></script>
  <script src="/app.js"></script>
</body>
</html>
